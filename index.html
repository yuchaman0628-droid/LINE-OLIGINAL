<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE風アプリ - ホーム & チャット</title>
  <style>
    :root {
      --bg-color: #7494C0;
      --header-bg: #273238;
      --my-msg-bg: #85E249;
      --other-msg-bg: #FFFFFF;
      --text-color: #111111;
      --time-color: #4A5568;
      --line-green: #06C755;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* アプリ共通コンテナ */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 750px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    /* 画面切り替えの制御 */
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* ------------------------------
       1. ホーム画面のスタイル
    ------------------------------ */
    .home-header {
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    .profile-card {
      display: flex;
      align-items: center;
      padding: 20px;
      gap: 16px;
      border-bottom: 8px solid #f7f9fa;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .profile-info .name {
      font-weight: bold;
      font-size: 16px;
    }

    .profile-info .status {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .menu-section {
      padding: 16px;
      flex: 1;
    }

    .menu-title {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .menu-item:hover {
      background-color: #f5f5f5;
    }

    .menu-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background-color: var(--line-green);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .menu-text .title {
      font-size: 14px;
      font-weight: bold;
    }

    .menu-text .desc {
      font-size: 11px;
      color: #888;
    }

    /* ------------------------------
       2. チャット画面のスタイル
    ------------------------------ */
    #chat-screen {
      background-color: var(--bg-color);
    }

    .chat-header {
      background-color: var(--header-bg);
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .user-toggle {
      background-color: #3b4a54;
      color: white;
      border: 1px solid #52636d;
      padding: 4px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 11px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 80%;
    }

    .message-content {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      color: var(--text-color);
    }

    .message-time {
      font-size: 10px;
      color: var(--time-color);
      white-space: nowrap;
    }

    .message.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.sent .message-content {
      background-color: var(--my-msg-bg);
      border-bottom-right-radius: 4px;
    }

    .message.received {
      align-self: flex-start;
    }

    .message.received .message-content {
      background-color: var(--other-msg-bg);
      border-bottom-left-radius: 4px;
    }

    .chat-input-area {
      background-color: #ffffff;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      padding: 10px 16px;
      outline: none;
      font-size: 14px;
      background-color: #f7f9fa;
    }

    .send-btn {
      background-color: var(--line-green);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="app-container">

  <div id="home-screen" class="screen active">
    <div class="home-header">ホーム</div>
    
    <div class="profile-card">
      <div class="avatar">👤</div>
      <div class="profile-info">
        <div class="name">自分のプロフィール</div>
        <div class="status">ステータスメッセージを設定できます</div>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-title">サービス・機能</div>
      
      <div class="menu-item" onclick="openChat()">
        <div class="menu-icon">💬</div>
        <div class="menu-text">
          <div class="title">オンラインチャットモード</div>
          <div class="title" style="font-weight: normal; color: #888;">チャットルームに入室して対話する</div>
        </div>
      </div>
    </div>
  </div>

  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button class="back-btn" onclick="openHome()">◀ 戻る</button>
      <span id="header-title" style="font-size: 14px;">トーク（送信者: ユーザーA）</span>
      <button class="user-toggle" onclick="toggleUser()">視点切替</button>
    </div>

    <div class="chat-messages" id="message-container">
      <div class="message received">
        <div class="message-content">ホーム画面からチャットルームに入室しました！</div>
        <div class="message-time">12:00</div>
      </div>
    </div>

    <form class="chat-input-area" onsubmit="sendMessage(event)">
      <input type="text" id="message-input" class="chat-input" placeholder="メッセージを入力..." autocomplete="off">
      <button type="submit" class="send-btn">➤</button>
    </form>
  </div>

</div>

<script>
  let currentUser = 'ユーザーA';

  // 画面切り替え関数
  function openChat() {
    document.getElementById('home-screen').classList.remove('active');
    document.getElementById('chat-screen').classList.add('active');
  }

  function openHome() {
    document.getElementById('chat-screen').classList.remove('active');
    document.getElementById('home-screen').classList.add('active');
  }

  // 送信者（視点）切り替え
  function toggleUser() {
    currentUser = currentUser === 'ユーザーA' ? 'ユーザーB' : 'ユーザーA';
    document.getElementById('header-title').textContent = `トーク（送信者: ${currentUser}）`;
  }

  // 現在時刻の取得
  function getCurrentTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    return `${hours}:${minutes}`;
  }

  // メッセージ送信
  function sendMessage(event) {
    event.preventDefault();

    const input = document.getElementById('message-input');
    const text = input.value.trim();

    if (text === '') return;

    const container = document.getElementById('message-container');

    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${currentUser === 'ユーザーA' ? 'sent' : 'received'}`;

    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';
    contentDiv.textContent = text;

    const timeDiv = document.createElement('div');
    timeDiv.className = 'message-time';
    timeDiv.textContent = getCurrentTime();

    msgDiv.appendChild(contentDiv);
    msgDiv.appendChild(timeDiv);
    container.appendChild(msgDiv);

    input.value = '';
    container.scrollTop = container.scrollHeight;
  }
</script>

</body>
</html>
