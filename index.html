<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グループチャット & 通話</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    .controls, .call-controls { margin-bottom: 10px; display: flex; gap: 5px; }
    input[type="text"] { flex: 1; padding: 8px; }
    button { padding: 8px 15px; cursor: pointer; }
    .status { font-weight: bold; color: #007bff; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h2>グループチャット & 通話</h2>
  <div class="status" id="status">未接続</div>

  <div class="controls">
    <input type="text" id="room-id" placeholder="ルームIDを入力">
    <button onclick="joinRoom()">ルームに参加</button>
  </div>

  <div class="call-controls">
    <button id="mic-btn" onclick="toggleMic()" disabled>マイク: OFF</button>
    <button id="call-btn" onclick="startVoiceCall()" disabled>通話を開始</button>
  </div>

  <div id="chat-box"></div>

  <div class="controls">
    <input type="text" id="message-input" placeholder="メッセージを入力..." disabled>
    <button id="send-btn" onclick="sendMessage()" disabled>送信</button>
  </div>

  <!-- 受信した音声再生用コンテナ -->
  <div id="audio-container"></div>

  <script>
    let peer = null;
    let localStream = null;
    let connections = [];
    let calls = [];
    let isMicOn = false;

    function joinRoom() {
      const roomId = document.getElementById('room-id').value.trim();
      if (!roomId) return alert('ルームIDを入力してください');

      // Peerの初期化（ランダムID取得）
      peer = new Peer();

      peer.on('open', (id) => {
        document.getElementById('status').innerText = `接続完了 (あなたのID: ${id})`;
        document.getElementById('message-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('mic-btn').disabled = false;
        document.getElementById('call-btn').disabled = false;
        
        appendMessage('システム', `ルーム「${roomId}」の準備ができました。`);
      });

      // 他端末からのデータ接続（チャット受信）
      peer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      // 他端末からの着信（通話受信）
      peer.on('call', async (call) => {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        }
        call.answer(localStream);
        setupCallStream(call);
      });
    }

    function setupDataConnection(conn) {
      connections.push(conn);
      conn.on('data', (data) => {
        appendMessage(conn.peer.substring(0, 5), data);
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      connections.forEach(conn => conn.send(text));
      appendMessage('自分', text);
      input.value = '';
    }

    async function toggleMic() {
      if (!localStream) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        } catch (e) {
          alert('マイクのアクセスが拒否されました');
          return;
        }
      }
      
      isMicOn = !isMicOn;
      localStream.getAudioTracks()[0].enabled = isMicOn;
      document.getElementById('mic-btn').innerText = `マイク: ${isMicOn ? 'ON' : 'OFF'}`;
    }

    async function startVoiceCall() {
      if (!localStream) {
        await toggleMic();
      }
      
      const targetPeerId = prompt('通話相手のPeer IDを入力してください:');
      if (!targetPeerId) return;

      const call = peer.call(targetPeerId, localStream);
      setupCallStream(call);
    }

    function setupCallStream(call) {
      calls.push(call);
      call.on('stream', (remoteStream) => {
        let audio = document.createElement('audio');
        audio.srcObject = remoteStream;
        audio.autoplay = true;
        document.getElementById('audio-container').appendChild(audio);
      });
    }

    function appendMessage(sender, text) {
      const chatBox = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.textContent = `[${sender}]: ${text}`;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
