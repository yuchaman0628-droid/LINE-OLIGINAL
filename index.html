<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>めっちゃカメレオン 3D - 広大な美術館編</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background-color: #0d0d11;
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            user-select: none;
            color: #fff;
        }
        #canvas-container { width: 100vw; height: 100vh; }

        /* タイトル画面 */
        #title-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #2c3e50 0%, #0d0d11 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        #title-screen h1 {
            font-size: 52px;
            color: #f39c12;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.6);
            margin-bottom: 15px;
        }
        #title-screen p {
            font-size: 16px;
            color: #bdc3c7;
            max-width: 500px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .start-btn {
            padding: 16px 45px;
            font-size: 22px;
            font-weight: bold;
            background: #f39c12;
            color: #111;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.4);
            transition: transform 0.2s, background 0.2s;
        }
        .start-btn:hover { transform: scale(1.08); background: #ffb733; }

        /* ゲーム画面HUD */
        #hud {
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(15, 15, 25, 0.85);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .timer-title { font-size: 12px; color: #aaa; }
        .timer-val { font-size: 28px; font-weight: bold; color: #2ecc71; font-family: monospace; }
        .guard-status { font-size: 13px; color: #e74c3c; margin-top: 4px; font-weight: bold; }

        /* パレットバー（画面上部中央） */
        #palette-bar {
            position: absolute;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }
        .color-swatch {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .color-swatch:hover { transform: scale(1.2); }
        .color-swatch.selected { border-color: #f39c12; transform: scale(1.3); box-shadow: 0 0 10px #f39c12; }

        /* 操作説明・ポーズバー（画面下部） */
        #controls-bar {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.9);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }
        .pose-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #666;
            background: #2a2a3a;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .pose-btn.active { background: #f39c12; color: #111; border-color: #fff; box-shadow: 0 0 10px rgba(243,156,18,0.5); }

        /* 擬態成功度バー */
        #stealth-meter {
            position: absolute;
            bottom: 80px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        #meter-bar-fill {
            width: 0%; height: 10px; background: #e74c3c; border-radius: 5px; transition: width 0.2s;
        }

        /* モーダル結果画面 */
        .modal-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .modal-screen.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #222; padding: 35px 50px; border-radius: 24px; border: 2px solid #444; text-align: center;
        }
        .restart-btn {
            margin-top: 20px; padding: 12px 30px; border: none; border-radius: 25px;
            background: #f39c12; color: #111; font-weight: bold; font-size: 16px; cursor: pointer;
        }
    </style>
    <!-- Three.js (3Dライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- タイトル画面 -->
    <div id="title-screen">
        <h1>🦎 めっちゃカメレオン 3D</h1>
        <p>広大な美術館に忍び込んだ棒人間カメレオン！<br>
        棒人間を<b>クリック＆ドラッグして直接色を塗り</b>、ポーズを合わせて絵画や彫刻と同化しよう。<br>
        スタート後<b>30秒で巡回鬼（学芸員）が出現</b>。3分間見つからずに隠れ切れ！</p>
        <button class="start-btn" onclick="startGame()">GAME START</button>
    </div>

    <!-- ゲームUI -->
    <div id="hud">
        <div class="timer-title">生き残り目標（残り時間）</div>
        <div class="timer-val" id="timer-display">03:00</div>
        <div class="guard-status" id="guard-status">鬼出現まで: 30秒</div>
    </div>

    <!-- パレットUI（直接ペイント用） -->
    <div id="palette-bar">
        <span style="font-size: 12px; color: #aaa;">体に塗る色:</span>
        <div id="palette-colors" style="display: flex; gap: 8px;"></div>
        <button style="padding: 4px 10px; font-size: 11px; background:#444; color:#fff; border:none; border-radius:6px; cursor:pointer;" onclick="resetPlayerColor()">色リセット</button>
    </div>

    <!-- 同化度メーター -->
    <div id="stealth-meter">
        <span>同化率:</span>
        <div style="width: 120px; height: 10px; background: #333; border-radius: 5px; overflow: hidden;">
            <div id="meter-bar-fill"></div>
        </div>
        <span id="stealth-text">0%</span>
    </div>

    <!-- ポーズUI -->
    <div id="controls-bar">
        <span style="font-size: 12px; color: #aaa;">[WASD] 移動 / [ドラッグ] 視点移動 & 色塗り | ポーズ:</span>
        <button class="pose-btn active" id="pose-0" onclick="setPose(0)">1. 直立</button>
        <button class="pose-btn" id="pose-1" onclick="setPose(1)">2. 額縁 (T字)</button>
        <button class="pose-btn" id="pose-2" onclick="setPose(2)">3. 彫刻 (思考者)</button>
        <button class="pose-btn" id="pose-3" onclick="setPose(3)">4. シャキーン</button>
    </div>

    <!-- 結果表示画面 -->
    <div id="game-over-screen" class="modal-screen">
        <div class="modal-card">
            <h2 style="color: #e74c3c; font-size: 36px;">見つかった！！</h2>
            <p style="margin-top: 10px; color:#aaa;">学芸員に偽物と見破られてしまいました...</p>
            <button class="restart-btn" onclick="restartGame()">リトライ</button>
        </div>
    </div>

    <div id="clear-screen" class="modal-screen">
        <div class="modal-card">
            <h2 style="color: #2ecc71; font-size: 36px;">STAGE CLEAR! 🎉</h2>
            <p style="margin-top: 10px; color:#aaa;">3分間完璧に隠れ切りました！最高のアート擬態です！</p>
            <button class="restart-btn" onclick="restartGame()">もう一度プレイ</button>
        </div>
    </div>

    <script>
        // --- 1. グローバル変数 ---
        let scene, camera, renderer;
        let player, headMesh, bodyMesh, armL, armR, legL, legR;
        let guard, flashlightCone;
        let isGameStarted = false, isGameOver = false, isClear = false;

        // タイマー管理
        let spawnCountdown = 30; // 鬼出現まで30秒
        let surviveTime = 180;   // 3分間（180秒）耐える
        let guardActive = false;
        let timerInterval = null;

        // 色塗り・キャンバステクスチャ関連
        let canvasTex, texCanvas, texCtx;
        let currentColor = '#ff3366';
        const paletteColors = ['#ffffff', '#ff3366', '#33aaff', '#2ecc71', '#f1c40f', '#9b59b6', '#34495e', '#000000'];

        // 三人称（TPS）カメラ制御
        let cameraAngleY = 0;
        let cameraAngleX = 0.3;
        let isMouseDown = false;
        let previousMouseX = 0, previousMouseY = 0;

        // 入力 ＆ ポーズ ＆ 展示物
        const keys = {};
        let currentPoseIndex = 0;
        const artExhibits = [];

        // Raycaster (3Dモデルを直接クリックして色塗りする用)
        const raycaster = new THREE.Raycaster();
        const mouseVec = new THREE.Vector2();

        // --- 2. 初期化 ---
        function init() {
            // シーン
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0d12);
            scene.fog = new THREE.FogExp2(0x0c0d12, 0.015);

            // カメラ (TPS視点)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // レンダラー
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 照明
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xfff0dd, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 各種生成
            initTextureCanvas();
            createLargeMuseumStage();
            createStickmanPlayer();
            createGuard();
            initPaletteUI();

            // イベント登録
            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if(e.key === '1') setPose(0);
                if(e.key === '2') setPose(1);
                if(e.key === '3') setPose(2);
                if(e.key === '4') setPose(3);
            });
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            // マウスによる3Dペイント ＆ 視点移動
            const dom = renderer.domElement;
            dom.addEventListener('mousedown', onMouseDown);
            dom.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', () => isMouseDown = false);
            window.addEventListener('resize', onWindowResize);

            // メインループスタート
            animate();
        }

        // --- 3. 動的テクスチャ（直接お絵描き用） ---
        function initTextureCanvas() {
            texCanvas = document.createElement('canvas');
            texCanvas.width = 256; texCanvas.height = 256;
            texCtx = texCanvas.getContext('2d');
            resetPlayerColor();

            canvasTex = new THREE.CanvasTexture(texCanvas);
            canvasTex.needsUpdate = true;
        }

        function resetPlayerColor() {
            texCtx.fillStyle = '#ffffff';
            texCtx.fillRect(0, 0, 256, 256);
            // 顔パーツ
            texCtx.fillStyle = '#111';
            texCtx.beginPath();
            texCtx.arc(80, 80, 14, 0, Math.PI*2);
            texCtx.arc(176, 80, 14, 0, Math.PI*2);
            texCtx.fill();
            texCtx.beginPath();
            texCtx.arc(128, 140, 30, 0, Math.PI);
            texCtx.lineWidth = 8;
            texCtx.strokeStyle = '#111';
            texCtx.stroke();
            if (canvasTex) canvasTex.needsUpdate = true;
        }

        function initPaletteUI() {
            const container = document.getElementById('palette-colors');
            paletteColors.forEach((color, idx) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch' + (idx === 1 ? ' selected' : '');
                swatch.style.backgroundColor = color;
                swatch.onclick = () => {
                    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                    swatch.classList.add('selected');
                    currentColor = color;
                };
                container.appendChild(swatch);
            });
        }

        // --- 4. 棒人間（プレイヤー）作成 ---
        function createStickmanPlayer() {
            player = new THREE.Group();

            const pMat = new THREE.MeshStandardMaterial({
                map: canvasTex,
                roughness: 0.3,
                metalness: 0.1
            });

            // 頭
            headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), pMat);
            headMesh.position.y = 2.0;
            headMesh.castShadow = true;
            headMesh.name = "paintable";
            player.add(headMesh);

            // 胴体
            bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.35, 1.2, 24), pMat);
            bodyMesh.position.y = 1.0;
            bodyMesh.castShadow = true;
            bodyMesh.name = "paintable";
            player.add(bodyMesh);

            function createLimb() {
                const g = new THREE.Group();
                const m = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.9, 16), pMat);
                m.position.y = -0.45;
                m.castShadow = true;
                m.name = "paintable";
                g.add(m);
                return g;
            }

            armR = createLimb(); armR.position.set(0.5, 1.4, 0); player.add(armR);
            armL = createLimb(); armL.position.set(-0.5, 1.4, 0); player.add(armL);
            legR = createLimb(); legR.position.set(0.25, 0.45, 0); player.add(legR);
            legL = createLimb(); legL.position.set(-0.25, 0.45, 0); player.add(legL);

            player.position.set(0, 0, 20);
            scene.add(player);
        }

        // ポーズ設定
        function setPose(idx) {
            if (isGameOver || isClear) return;
            currentPoseIndex = idx;
            document.querySelectorAll('.pose-btn').forEach((b, i) => b.classList.toggle('active', i === idx));

            if (idx === 0) { // 通常
                armR.rotation.set(0, 0, -0.3); armL.rotation.set(0, 0, 0.3);
                legR.rotation.set(0, 0, -0.05); legL.rotation.set(0, 0, 0.05);
            } else if (idx === 1) { // T字
                armR.rotation.set(0, 0, -Math.PI/2); armL.rotation.set(0, 0, Math.PI/2);
                legR.rotation.set(0,0,0); legL.rotation.set(0,0,0);
            } else if (idx === 2) { // 思考者
                armR.rotation.set(1.2, -0.5, -0.4); armL.rotation.set(0.5, 0.2, 0.2);
                legR.rotation.set(-0.8, 0, 0.2); legL.rotation.set(-0.4, 0, -0.2);
            } else if (idx === 3) { // 星型
                armR.rotation.set(0, 0, -2.3); armL.rotation.set(0, 0, 2.3);
                legR.rotation.set(0, 0, -0.6); legL.rotation.set(0, 0, 0.6);
            }
        }

        // --- 5. 巨大美術館ステージ構築 ---
        function createLargeMuseumStage() {
            // 広大な床 (60x60)
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(60, 60),
                new THREE.MeshStandardMaterial({ color: 0x221a15, roughness: 0.2, metalness: 0.1 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 周囲の壁
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f2a38, roughness: 0.8 });
            createWall(0, 6, -30, 60, 12, 1, wallMat);
            createWall(-30, 6, 0, 1, 12, 60, wallMat);
            createWall(30, 6, 0, 1, 12, 60, wallMat);

            // 区切り壁（迷路風）
            createWall(-10, 6, 0, 1, 12, 30, wallMat);
            createWall(10, 6, -10, 1, 12, 30, wallMat);

            // --- リアルな絵画 ＆ 彫刻スポットの配置 ---
            // 1. 赤グラデーション名画 (左エリア)
            createRealisticArtFrame(-29.2, 5, 10, 6, 8, '#ff3366', 1, "赤の抽象名画");
            // 2. 青の夜空名画 (中央奥壁)
            createRealisticArtFrame(0, 5, -29.2, 8, 6, '#33aaff', 3, "青の夜空名画");
            // 3. 黄色の黄金彫刻スポット (右エリア)
            createStatueSpot(20, 0, 5, '#f1c40f', 2, "黄金の思考像");
            // 4. 緑の森林絵画 (左奥)
            createRealisticArtFrame(-20, 5, -29.2, 7, 5, '#2ecc71', 1, "緑の深林図");
        }

        function createWall(x, y, z, w, h, d, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true; mesh.castShadow = true;
            scene.add(mesh);
        }

        // リアルなキャンバス（模様付き絵画）を生成
        function createRealisticArtFrame(x, y, z, w, h, mainColor, targetPoseIdx, name) {
            const group = new THREE.Group();

            // 豪華な額縁
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(w + 0.6, h + 0.6, 0.3),
                new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.3 })
            );
            group.add(frame);

            // 動的模様キャンバスの作成
            const artCanvas = document.createElement('canvas');
            artCanvas.width = 256; artCanvas.height = 256;
            const actx = artCanvas.getContext('2d');
            
            // グラデーションアート模様の描画
            const grad = actx.createRadialGradient(128, 128, 10, 128, 128, 120);
            grad.addColorStop(0, mainColor);
            grad.addColorStop(1, '#111122');
            actx.fillStyle = grad;
            actx.fillRect(0, 0, 256, 256);

            // 芸術的な模様
            actx.strokeStyle = '#ffffff';
            actx.lineWidth = 4;
            actx.beginPath();
            actx.arc(128, 128, 80, 0, Math.PI * 2);
            actx.stroke();

            const artTex = new THREE.CanvasTexture(artCanvas);
            const canvasMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(w, h),
                new THREE.MeshStandardMaterial({ map: artTex, roughness: 0.4 })
            );
            canvasMesh.position.z = 0.16;
            group.add(canvasMesh);

            group.position.set(x, y, z);
            if (x < -25) group.rotation.y = Math.PI / 2;
            scene.add(group);

            // 擬態判定用データ
            artExhibits.push({
                position: new THREE.Vector3(x + (x < -25 ? 1.8 : 0), 0, z + (z < -25 ? 1.8 : 0)),
                targetColorHex: mainColor,
                requiredPose: targetPoseIdx,
                name: name
            });
        }

        function createStatueSpot(x, y, z, mainColor, targetPoseIdx, name) {
            const ped = new THREE.Mesh(
                new THREE.CylinderGeometry(2, 2.2, 1.2, 32),
                new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.5 })
            );
            ped.position.set(x, 0.6, z);
            scene.add(ped);

            const bg = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 7, 5),
                new THREE.MeshStandardMaterial({ color: mainColor })
            );
            bg.position.set(x + 1.5, 3.5, z);
            scene.add(bg);

            artExhibits.push({
                position: new THREE.Vector3(x, 0, z),
                targetColorHex: mainColor,
                requiredPose: targetPoseIdx,
                name: name
            });
        }

        // --- 6. 鬼（学芸員）生成 ---
        function createGuard() {
            guard = new THREE.Group();

            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.6, 1.8, 16),
                new THREE.MeshStandardMaterial({ color: 0x2c3e50 })
            );
            body.position.y = 0.9;
            guard.add(body);

            // 懐中電灯（ライトビーム）
            const coneGeo = new THREE.ConeGeometry(5, 16, 16, 1, true);
            coneGeo.rotateX(-Math.PI / 2);
            coneGeo.translate(0, 0, 8);
            flashlightCone = new THREE.Mesh(coneGeo, new THREE.MeshBasicMaterial({
                color: 0xff3344, transparent: true, opacity: 0.35, side: THREE.DoubleSide
            }));
            flashlightCone.position.set(0, 1.5, 0);
            guard.add(flashlightCone);

            guard.position.set(0, 0, -20);
            guard.visible = false; // 最初は非表示（30秒後に登場）
            scene.add(guard);
        }

        // --- 7. マウスで3Dモデルへ直接ペイント ＆ カメラ操作 ---
        function onMouseDown(e) {
            if (!isGameStarted || isGameOver || isClear) return;
            isMouseDown = true;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;

            // レイキャストで棒人間をクリックしたか判定
            mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouseVec, camera);

            const intersects = raycaster.intersectObjects(player.children, true);
            if (intersects.length > 0) {
                // 直接体にペイント！
                const uv = intersects[0].uv;
                if (uv) {
                    const x = uv.x * 256;
                    const y = (1 - uv.y) * 256;
                    texCtx.fillStyle = currentColor;
                    texCtx.beginPath();
                    texCtx.arc(x, y, 16, 0, Math.PI * 2);
                    texCtx.fill();
                    canvasTex.needsUpdate = true;
                }
            }
        }

        function onMouseMove(e) {
            if (!isMouseDown) return;
            const deltaX = e.clientX - previousMouseX;
            const deltaY = e.clientY - previousMouseY;

            // 右ドラッグ/通常ドラッグでカメラ視点回転
            cameraAngleY -= deltaX * 0.005;
            cameraAngleX = Math.max(0.1, Math.min(1.2, cameraAngleX + deltaY * 0.005));

            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        }

        // --- 8. ゲーム開始・タイマー処理 ---
        function startGame() {
            document.getElementById('title-screen').style.display = 'none';
            isGameStarted = true;

            // カウントダウン開始
            timerInterval = setInterval(() => {
                if (!isGameStarted || isGameOver || isClear) return;

                if (!guardActive) {
                    spawnCountdown--;
                    document.getElementById('guard-status').innerText = `鬼出現まで: ${spawnCountdown}秒`;
                    if (spawnCountdown <= 0) {
                        guardActive = true;
                        guard.visible = true;
                        document.getElementById('guard-status').innerText = `⚠️ 鬼が巡回中！隠れろ！`;
                    }
                } else {
                    surviveTime--;
                    const mins = Math.floor(surviveTime / 60).toString().padStart(2, '0');
                    const secs = (surviveTime % 60).toString().padStart(2, '0');
                    document.getElementById('timer-display').innerText = `${mins}:${secs}`;

                    if (surviveTime <= 0) {
                        gameClear();
                    }
                }
            }, 1000);
        }

        // --- 9. メインゲームループ ---
        function animate() {
            requestAnimationFrame(animate);

            if (isGameStarted && !isGameOver && !isClear) {
                updatePlayerMovement();
                updateTPSCamera();
                if (guardActive) updateGuardPatrol();
                checkStealthAndDetection();
            }

            renderer.render(scene, camera);
        }

        // プレイヤー移動（TPS視点基準）
        function updatePlayerMovement() {
            const speed = 0.16;
            let moveX = 0, moveZ = 0;

            if (keys['w'] || keys['arrowup']) moveZ -= speed;
            if (keys['s'] || keys['arrowdown']) moveZ += speed;
            if (keys['a'] || keys['arrowleft']) moveX -= speed;
            if (keys['d'] || keys['arrowright']) moveX += speed;

            if (moveX !== 0 || moveZ !== 0) {
                // カメラの向きに合わせて移動方向を計算
                const angle = cameraAngleY;
                const rx = moveX * Math.cos(angle) - moveZ * Math.sin(angle);
                const rz = moveX * Math.sin(angle) + moveZ * Math.cos(angle);

                player.position.x += rx;
                player.position.z += rz;
                player.rotation.y = Math.atan2(rx, rz);
            }

            // エリア制限
            player.position.x = Math.max(-28, Math.min(28, player.position.x));
            player.position.z = Math.max(-28, Math.min(28, player.position.z));
        }

        // 三人称（TPS）カメラ追従
        function updateTPSCamera() {
            const dist = 9;
            camera.position.x = player.position.x + dist * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
            camera.position.y = player.position.y + dist * Math.sin(cameraAngleX) + 1.5;
            camera.position.z = player.position.z + dist * Math.cos(cameraAngleY) * Math.cos(cameraAngleX);
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);
        }

        // 鬼の巡回パターン
        function updateGuardPatrol() {
            const t = Date.now() * 0.0008;
            guard.position.x = Math.sin(t) * 18;
            guard.position.z = Math.cos(t * 0.7) * 18;
            guard.rotation.y = t * 1.5;
        }

        // 擬態 ＆ 発見チェック
        function checkStealthAndDetection() {
            let bestStealthScore = 0;

            artExhibits.forEach(exhibit => {
                const dist = player.position.distanceTo(exhibit.position);
                if (dist < 3.5) { // 展示スポット内
                    let score = 0;

                    // ポーズ一致
                    if (currentPoseIndex === exhibit.requiredPose) score += 50;

                    // 体の色の一致度を検証（テクスチャの中心色）
                    const pData = texCtx.getImageData(128, 128, 1, 1).data;
                    const rgbHex = '#' + ((1 << 24) + (pData[0] << 16) + (pData[1] << 8) + pData[2]).toString(16).slice(1);
                    
                    if (isSimilarColor(rgbHex, exhibit.targetColorHex)) {
                        score += 50;
                    }

                    if (score > bestStealthScore) bestStealthScore = score;
                }
            });

            // UI更新
            document.getElementById('meter-bar-fill').style.width = bestStealthScore + '%';
            document.getElementById('stealth-text').innerText = bestStealthScore + '%';

            // 鬼の視線判定
            if (guardActive) {
                const diff = new THREE.Vector3().subVectors(player.position, guard.position);
                if (diff.length() < 14) {
                    const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(guard.quaternion);
                    if (forward.angleTo(diff.normalize()) < 0.5) {
                        // 照らされていて同化度80%未満ならアウト！
                        if (bestStealthScore < 80) {
                            gameOver();
                        }
                    }
                }
            }
        }

        function isSimilarColor(c1, c2) {
            // 簡易色比較
            return c1.toLowerCase() === c2.toLowerCase();
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(timerInterval);
            document.getElementById('game-over-screen').classList.add('active');
        }

        function gameClear() {
            isClear = true;
            clearInterval(timerInterval);
            document.getElementById('clear-screen').classList.add('active');
        }

        function restartGame() {
            location.reload();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
