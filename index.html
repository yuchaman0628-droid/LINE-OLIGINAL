<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE風チャットアプリ</title>
  <style>
    :root {
      --bg-color: #7494C0;
      --header-bg: #273238;
      --my-msg-bg: #85E249;
      --other-msg-bg: #FFFFFF;
      --text-color: #111111;
      --time-color: #4A5568;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* アプリのコンテナ（スマホ風画面） */
    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 750px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      border-radius: 16px;
      overflow: hidden;
    }

    /* ヘッダー */
    .chat-header {
      background-color: var(--header-bg);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .user-toggle {
      background-color: #3b4a54;
      color: white;
      border: 1px solid #52636d;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    .user-toggle:hover {
      background-color: #4a5b67;
    }

    /* チャット表示エリア */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* メッセージ共通スタイル */
    .message {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 80%;
    }

    .message-content {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      color: var(--text-color);
    }

    .message-time {
      font-size: 10px;
      color: var(--time-color);
      white-space: nowrap;
    }

    /* 送信者（自分）メッセージ */
    .message.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.sent .message-content {
      background-color: var(--my-msg-bg);
      border-bottom-right-radius: 4px;
    }

    /* 受信者（相手）メッセージ */
    .message.received {
      align-self: flex-start;
    }

    .message.received .message-content {
      background-color: var(--other-msg-bg);
      border-bottom-left-radius: 4px;
    }

    /* 入力エリア */
    .chat-input-area {
      background-color: #ffffff;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      padding: 10px 16px;
      outline: none;
      font-size: 14px;
      background-color: #f7f9fa;
    }

    .chat-input:focus {
      border-color: #00b900;
    }

    .send-btn {
      background-color: #00b900;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background-color: #009900;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span id="header-title">トーク（送信者: ユーザーA）</span>
    <button class="user-toggle" onclick="toggleUser()">視点を切替 (A/B)</button>
  </div>

  <div class="chat-messages" id="message-container">
    <div class="message received">
      <div class="message-content">こんにちは！LINE風チャットアプリへようこそ。</div>
      <div class="message-time">12:00</div>
    </div>
  </div>

  <form class="chat-input-area" onsubmit="sendMessage(event)">
    <input type="text" id="message-input" class="chat-input" placeholder="メッセージを入力..." autocomplete="off">
    <button type="submit" class="send-btn">➤</button>
  </form>
</div>

<script>
  let currentUser = 'ユーザーA';

  // 送信者（視点）の切り替え
  function toggleUser() {
    currentUser = currentUser === 'ユーザーA' ? 'ユーザーB' : 'ユーザーA';
    document.getElementById('header-title').textContent = `トーク（送信者: ${currentUser}）`;
  }

  // 現在の時刻を取得する関数
  function getCurrentTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    return `${hours}:${minutes}`;
  }

  // メッセージ送信処理
  function sendMessage(event) {
    event.preventDefault();

    const input = document.getElementById('message-input');
    const text = input.value.trim();

    if (text === '') return;

    const container = document.getElementById('message-container');

    // メッセージ要素を作成
    const msgDiv = document.createElement('div');
    // ユーザーAの時は右側（sent）、ユーザーBの時は左側（received）として描画
    msgDiv.className = `message ${currentUser === 'ユーザーA' ? 'sent' : 'received'}`;

    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';
    contentDiv.textContent = text;

    const timeDiv = document.createElement('div');
    timeDiv.className = 'message-time';
    timeDiv.textContent = getCurrentTime();

    msgDiv.appendChild(contentDiv);
    msgDiv.appendChild(timeDiv);
    container.appendChild(msgDiv);

    // 入力欄をクリアして最下部にスクロール
    input.value = '';
    container.scrollTop = container.scrollHeight;
  }
</script>

</body>
</html>
